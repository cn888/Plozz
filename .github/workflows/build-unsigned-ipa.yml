name: Build unsigned IPA

# 放到自己 fork 的 .github/workflows/ 下，在 Actions 页面点 "Run workflow"。
# 产物是一个未签名的 Plozz-unsigned.ipa（artifact，保留 7 天）。
# 未签名 IPA 不能直接装：需要用 Sideloadly / AltStore 配自己的 Apple ID 再签一次。

on:
  workflow_dispatch:

jobs:
  ipa:
    # 注意：上游 CI 用的是自建 runner 标签 xcode-27。这里用 GitHub 托管的
    # macos-latest；如果因为 Xcode 太旧编译失败，就换成更新的镜像（如 macos-26）。
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # 用裸 xcodegen 而不是 tools/generate-project.sh：后者要连上游的
          # apple-build-lease 租约服务。版本号会退到 project.yml 的默认值，不影响使用。
          xcodegen generate

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Plozz.xcodeproj \
            -target PlozziOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log | tail -n 60

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "app bundle: $APP"
          rm -rf Payload Plozz-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Plozz-unsigned.ipa Payload
          ls -lh Plozz-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Plozz-unsigned-ipa
          path: Plozz-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
