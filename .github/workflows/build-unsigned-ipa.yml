name: Build unsigned IPA

# 手动触发；可指定 runner 型号，用来绕开 macOS 免费机器的容量排队。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (macos-15 / macos-14 / macos-13 / macos-latest)'
        required: false
        default: 'macos-15'

jobs:
  ipa:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # 用裸 xcodegen：上游 tools/generate-project.sh 依赖自建 build-lease 服务。
          xcodegen generate
          xcodebuild -list -project Plozz.xcodeproj || true

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          # 注意：-target 不能和 -derivedDataPath 同时用（会报 exit 64），
          # 所以这里用 CONFIGURATION_BUILD_DIR 把产物固定输出到 build/out。
          xcodebuild build \
            -project Plozz.xcodeproj \
            -target PlozziOS \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/out" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log | tail -n 80

      - name: Package unsigned IPA
        run: |
          APP=$(find build/out -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "app bundle: $APP"
          rm -rf Payload Plozz-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Plozz-unsigned.ipa Payload
          ls -lh Plozz-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Plozz-unsigned-ipa
          path: Plozz-unsigned.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
