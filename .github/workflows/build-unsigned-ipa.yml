name: Build unsigned IPA

# 手动触发。两个可调参数：
#   runner: 机器型号（macos-15 的镜像里有 Xcode 26.3，实测可用）
#   mode:   build 方式 —— scheme（推荐，和上游 CI 一致）或 target
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: false
        default: 'macos-15'
      mode:
        description: 'Build mode: scheme | scheme-loose | target'
        required: false
        default: 'scheme'

jobs:
  ipa:
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: |
          echo "=== 已安装的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then
            echo "选用: $NEWEST"
            sudo xcode-select -s "$NEWEST"
          fi

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          echo "iOS SDK major = $SDK_MAJOR"
          # Plozz 依赖的 AetherEngine 用到 iOS 26 API，SDK 太旧必然失败，提前明确报错
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::iOS SDK 只有 $SDK_MAJOR，需要 26+（Plozz 用到 iOS 26 API）"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # 用裸 xcodegen：上游 tools/generate-project.sh 依赖自建 build-lease 服务
          xcodegen generate
          echo "=== 可用 scheme ==="
          xcodebuild -list -project Plozz.xcodeproj 2>&1 | tee -a build.log || true

      - name: Build via scheme (upstream style)
        if: ${{ startsWith(github.event.inputs.mode || 'scheme', 'scheme') }}
        run: |
          set -o pipefail
          # scheme-loose: AetherEngine 里有一处 Swift 6 严格并发报错，
          # 放宽为 minimal + Swift 5 语言模式以放行依赖库。
          EXTRA=""
          if [ "${{ github.event.inputs.mode }}" = "scheme-loose" ]; then
            echo "== 使用放宽的并发检查 =="
            EXTRA="SWIFT_STRICT_CONCURRENCY=minimal SWIFT_VERSION=5"
          fi
          xcodebuild build \
            -project Plozz.xcodeproj \
            -scheme PlozziOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            $EXTRA \
            2>&1 | tee -a build.log | tail -n 80

      - name: Build via target (fallback)
        if: ${{ github.event.inputs.mode == 'target' }}
        run: |
          set -o pipefail
          # -target 不能配 -derivedDataPath（会 exit 64），所以用 CONFIGURATION_BUILD_DIR
          # 另外关掉显式模块，绕开 SwiftPM 并发构建 module map 的竞态
          xcodebuild build \
            -project Plozz.xcodeproj \
            -target PlozziOS \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/out" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            2>&1 | tee -a build.log | tail -n 80

      - name: Package unsigned IPA
        run: |
          APP=$(find build/out build/dd/Build/Products -maxdepth 3 -name '*.app' 2>/dev/null | head -n 1)
          test -n "$APP" || { echo "no .app produced"; ls -R build | head -50; exit 1; }
          echo "app bundle: $APP"
          rm -rf Payload Plozz-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Plozz-unsigned.ipa Payload
          ls -lh Plozz-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

      - name: Upload IPA
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Plozz-unsigned-ipa
          path: Plozz-unsigned.ipa
          retention-days: 7

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
